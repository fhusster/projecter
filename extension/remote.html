<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Projecter Remote</title>
<link rel="stylesheet" href="remote.css">
<style>
  html,body{margin:0}
  body{min-height:100vh}
  body{padding:14px;box-sizing:border-box;font:13.5px/1.4 "Segoe UI",Inter,system-ui,sans-serif;color:#f2f3f7;overflow-y:auto;
    background:radial-gradient(120% 60% at 0% 0%,rgba(255,61,110,.16),transparent 60%),
               radial-gradient(120% 60% at 100% 0%,rgba(122,92,255,.18),transparent 60%),#0b0c12}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
  .logo img{width:20px;height:20px;border-radius:6px}
  .logo b{background:linear-gradient(120deg,#ff3d6e,#7a5cff 55%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .keys{font-size:11px;color:#5d6273}
  /* the pop-out window is roomier: bigger artwork on top */
  #remote .rm-top{flex-direction:column;align-items:stretch}
  #remote .rm-art{width:100%}
  #remote .rm-title{font-size:15px}
</style></head>
<body>
  <header><div class="logo"><img src="icons/icon32.png" alt=""><span>pro<b>jecter</b> remote</span></div><span class="keys">Space · ← → · ↑ ↓</span></header>
  <div id="remote"></div>
  <script src="remote.js"></script>
  <script src="remote-window.js"></script>
</body></html>
