<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Projecter</title>
<link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="remote.css"></head>
<body>
  <header>
    <div class="logo"><img src="icons/icon32.png" alt=""><span>pro<b>jecter</b></span></div>
    <span class="conn" id="conn"><i></i><span>Connecting…</span></span>
  </header>

  <section id="down" class="down" hidden>
    <div class="dt">Projecter isn't running</div>
    <div class="dd">It runs on this laptop and does the streaming to your TVs.</div>
    <button class="go" id="start">Start Projecter</button>
  </section>

  <section id="remote" class="remote" hidden></section>

  <section class="page" id="page">
    <div class="thumb" id="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m10 9.5 4.5 2.5-4.5 2.5z" fill="currentColor"/></svg></div>
    <div class="pinfo">
      <div class="pt" id="ptitle">This page</div>
      <div class="pd" id="pdetail">Looking for video…</div>
    </div>
  </section>

  <div class="label">Play it on</div>
  <section id="tvs" class="tvs"><div class="empty">Looking for TVs…</div></section>

  <div id="err" class="err" hidden></div>

  <footer>
    <label class="opt"><input type="checkbox" id="resume"><span class="sw"></span>Start where I am</label>
    <label class="opt"><input type="checkbox" id="pauseBrowser"><span class="sw"></span>Pause the video here</label>
    <label class="opt"><input type="checkbox" id="overlay"><span class="sw"></span>Show “Project” button on videos</label>
    <label class="opt"><input type="checkbox" id="autoRemote"><span class="sw"></span>Open the remote window when I project</label>
    <label class="opt"><input type="checkbox" id="autoSubs"><span class="sw"></span>Use the subtitles the page is showing</label>
    <button class="link" id="open">Open Projecter ↗</button>
  </footer>
<script src="remote.js"></script>
<script src="popup.js"></script>
</body></html>
